let idx=0,score=0,answered=false,name="",reg="",email="";
function startQuiz(){
 name=document.getElementById('name').value.trim();reg=document.getElementById('reg').value.trim();email=document.getElementById('email').value.trim();
 if(!name||!reg||!email){alert("Please enter Name, Register Number and Email ID.");return;}
 document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion();
}
function showQuestion(){
 answered=false;const item=questions[idx];const chapter=Math.floor(idx/30)+1;const within=idx%30+1;
 document.getElementById('chapterTitle').textContent="Chapter "+chapter;
 document.getElementById('progressText').textContent="Question "+within+" of 30 • Overall "+(idx+1)+" of 180";
 document.getElementById('fill').style.width=((within/30)*100)+"%";
 let s="<h2>"+within+". "+item.q+"</h2>";
 item.options.forEach((o,i)=>{s+=`<label class="option" id="opt${i}"><input type="radio" name="ans" value="${i}" onchange="checkAnswer(${i})"> ${o}</label>`;});
 s+=`<div id="feedback"></div><button id="next" disabled onclick="nextQuestion()">${within===30?(chapter===6?"Finish Quiz":"Next Chapter"):"Next Question"}</button>`;
 document.getElementById('questionCard').innerHTML=s;
}
function checkAnswer(selected){
 if(answered)return;answered=true;const item=questions[idx];const options=document.querySelectorAll('.option');
 options[item.answer].classList.add('correct');
 if(selected===item.answer){score++;document.getElementById('feedback').textContent="✓ Correct! +1 mark";document.getElementById('feedback').style.color="#16803c";}
 else{options[selected].classList.add('wrong');document.getElementById('feedback').textContent="✗ Wrong. Correct answer: "+item.options[item.answer];document.getElementById('feedback').style.color="#c53030";}
 document.getElementById('next').disabled=false;document.querySelectorAll('input[name="ans"]').forEach(x=>x.disabled=true);
}
function nextQuestion(){idx++;if(idx>=questions.length)showResult();else showQuestion();}
function showResult(){
 document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
 const pct=(score/questions.length*100).toFixed(2);
 document.getElementById('resultText').innerHTML="<p><b>Name:</b> "+name+"</p><p><b>Register Number:</b> "+reg+"</p><p><b>Email:</b> "+email+"</p><h2>Score: "+score+" / 180</h2><h2>Percentage: "+pct+"%</h2>";
}
</script></body></html>
